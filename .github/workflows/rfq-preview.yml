name: Verify the released RFQ demo in Chrome
on:
  push:
    branches: [qa/rfq-preview-100fa2e]
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the Chrome test driver
        run: npm install --prefix .qa-tools --no-audit --no-fund --ignore-scripts playwright-core@1
      - name: Verify the public desktop and mobile RFQ workflows
        env:
          RFQ_ORIGIN: https://www.worksplice.site
        run: node qa/review-rfq.cjs
      - name: Save production screenshots and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfq-live-browser-evidence
          path: qa-evidence/
          retention-days: 3
